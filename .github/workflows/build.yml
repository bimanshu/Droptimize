# Builds the app and runs the unit tests on macOS. This is the real compile check:
# agents working in Linux containers can't build AppKit/SwiftUI code locally (see HANDOFF.md).
# Every green push also refreshes the "preview" release with a DMG, so the owner can
# download the latest build from one fixed link without Xcode.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # libwebp is rebuilt only when scripts/build-deps.sh changes (it pins the version).
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: Vendor
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Generate project
        run: xcodegen generate

      - name: Build and test
        run: |
          set +e
          xcodebuild test \
            -project Droptimize.xcodeproj \
            -scheme Droptimize \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            > build.log 2>&1
          status=$?
          grep -E 'error:|Test Suite .* (passed|failed)|Test Case .* failed|Executed|\*\* (BUILD|TEST)' build.log || true
          exit $status

      - name: Warnings
        # CORE.md §12: fix warnings, not just errors. Any compiler warning fails the build.
        run: |
          grep -E '^/.*: warning:' build.log | sort -u > warnings.txt || true
          echo "$(wc -l < warnings.txt | tr -d ' ') unique warning(s)"
          cat warnings.txt
          test ! -s warnings.txt

      - name: Release build (universal)
        run: |
          set +e
          xcodebuild build \
            -project Droptimize.xcodeproj \
            -scheme Droptimize \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            > release.log 2>&1
          status=$?
          grep -E 'error:|\*\* BUILD' release.log || true
          exit $status

      - name: Make DMG
        run: |
          app=build/Build/Products/Release/Droptimize.app
          lipo -archs "$app/Contents/MacOS/Droptimize"
          codesign --verify --deep --strict "$app"
          stage=$(mktemp -d)/Droptimize
          mkdir -p "$stage"
          ditto "$app" "$stage/Droptimize.app"
          ln -s /Applications "$stage/Applications"
          cp scripts/dmg-readme.txt "$stage/READ ME FIRST.txt"
          hdiutil create -volname Droptimize -srcfolder "$stage" -fs HFS+ -format UDZO -ov Droptimize.dmg
          hdiutil verify Droptimize.dmg
          ls -lh Droptimize.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Droptimize-dmg
          path: Droptimize.dmg
          retention-days: 14

  # Replaces the "preview" pre-release with this build. Its download link never changes:
  # https://github.com/<owner>/<repo>/releases/download/preview/Droptimize.dmg
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: preview-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Droptimize-dmg

      - name: Release notes
        run: |
          cat > notes.md <<EOF
          **Latest build of Droptimize. Replaced automatically on every successful push.**

          Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}, build ${{ github.run_number }}, $(date -u '+%Y-%m-%d %H:%M UTC').
          Early preview. Working: **WebP**, **Compress** (JPEG, PNG, WebP, HEIC) and **Half size**; the center (Auto) does WebP for now. Results are saved next to the original (never changed) and copied to the clipboard. AVIF, Remove BG and video are coming soon.

          ### Install
          1. Download **Droptimize.dmg** below and open it.
          2. Drag **Droptimize** into **Applications**.
          3. The app isn't notarized by Apple yet, so macOS blocks it the first time. Open **Terminal** and run:
             \`\`\`
             xattr -cr /Applications/Droptimize.app
             \`\`\`
             Or: open the app, click **Done**, then go to **System Settings → Privacy & Security** and click **Open Anyway**.
          4. Open Droptimize. There's no window or Dock icon: look for the drop icon in the menu bar and the bubble on the right edge of your screen.
          5. The first time it saves into Desktop, Documents or Downloads, macOS asks for access to that folder. Click **Allow**. Each new preview build may ask again.

          Needs macOS 14 (Sonoma) or newer. Works on Apple Silicon and Intel Macs.
          EOF

      - name: Replace the preview release
        run: |
          gh release delete preview --yes --cleanup-tag || true
          gh release create preview Droptimize.dmg \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Droptimize preview" \
            --notes-file notes.md
          echo "https://github.com/$GH_REPO/releases/download/preview/Droptimize.dmg"
