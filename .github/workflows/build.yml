# Builds the app and runs the unit tests on macOS. This is the real compile check:
# agents working in Linux containers can't build AppKit/SwiftUI code locally (see HANDOFF.md).
# Every green push also refreshes the "preview" release (a DMG, a zip and scripts/install.sh),
# so the owner can install or update with one Terminal command, no Xcode needed.
# A run started by hand with a version (Actions → Build → Run workflow, or `gh workflow run build.yml
# -f release_version=1.0.0`) also publishes the "stable" release, whose update.json the app's
# built-in updater reads (App/Updater.swift). That needs the UPDATE_SIGNING_KEY secret (HANDOFF.md).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release to everyone as this version (e.g. 1.0.0). Leave empty for a preview only."
        required: false
        default: ""
      release_notes:
        description: "What's new, shown in the app's update window (plain text)"
        required: false
        default: ""

concurrency:
  # A release run gets a group of its own, so a later push can't cancel it halfway.
  group: ${{ inputs.release_version && format('release-{0}', inputs.release_version) || format('build-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.release_version }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Check the release version
        if: inputs.release_version
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] \
            || { echo "::error::release_version must look like 1.0 or 1.0.1, not '$RELEASE_VERSION'"; exit 1; }

      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install tools
        # nasm: libaom's and libvpx's fast x86 code for the Intel slice. cmake builds libaom, libavif and libopus.
        run: |
          brew install xcodegen nasm
          command -v cmake || brew install cmake

      # libwebp, libaom, libavif, libvpx and libopus are rebuilt only when scripts/build-deps.sh changes (it pins
      # the versions). The first build after a change takes several minutes.
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: Vendor
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Generate project
        run: xcodegen generate

      - name: Build and test
        run: |
          set +e
          xcodebuild test \
            -project Droptimize.xcodeproj \
            -scheme Droptimize \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            > build.log 2>&1
          status=$?
          grep -E 'error:|Test Suite .* (passed|failed)|Test Case .* failed|Executed|\*\* (BUILD|TEST)' build.log || true
          exit $status

      - name: Warnings
        # CORE.md §12: fix warnings, not just errors. Any compiler warning fails the build.
        run: |
          grep -E '^/.*: warning:' build.log | sort -u > warnings.txt || true
          echo "$(wc -l < warnings.txt | tr -d ' ') unique warning(s)"
          cat warnings.txt
          test ! -s warnings.txt

      - name: Release build (universal)
        # The build number (CFBundleVersion) is the run number, which only goes up: it's what the
        # updater compares. A release also sets the version people see (CFBundleShortVersionString).
        run: |
          set +e
          xcodebuild build \
            -project Droptimize.xcodeproj \
            -scheme Droptimize \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ${RELEASE_VERSION:+MARKETING_VERSION=$RELEASE_VERSION} \
            > release.log 2>&1
          status=$?
          grep -E 'error:|\*\* BUILD' release.log || true
          exit $status

      - name: Make DMG
        run: |
          app=build/Build/Products/Release/Droptimize.app
          lipo -archs "$app/Contents/MacOS/Droptimize"
          codesign --verify --deep --strict "$app"
          stage=$(mktemp -d)/Droptimize
          mkdir -p "$stage"
          ditto "$app" "$stage/Droptimize.app"
          ln -s /Applications "$stage/Applications"
          cp scripts/dmg-readme.txt "$stage/READ ME FIRST.txt"
          hdiutil create -volname Droptimize -srcfolder "$stage" -fs HFS+ -format UDZO -ov Droptimize.dmg
          hdiutil verify Droptimize.dmg
          # The zip is what scripts/install.sh downloads.
          ditto -c -k --keepParent "$app" Droptimize.zip
          ls -lh Droptimize.dmg Droptimize.zip

      - name: Test the install script
        # With the system bash (3.2), as on the owner's Mac: a fresh install, then an update over it.
        run: |
          apps="$RUNNER_TEMP/Applications"
          for run in install update; do
            DROPTIMIZE_ZIP="file://$PWD/Droptimize.zip" DROPTIMIZE_DIR="$apps" DROPTIMIZE_NO_OPEN=1 \
              /bin/bash < scripts/install.sh
          done
          codesign --verify --deep --strict "$apps/Droptimize.app"
          test -x "$apps/Droptimize.app/Contents/MacOS/Droptimize"
          test ! -e "$apps/Droptimize.app.new"

      - name: Test the update signer
        # Every run, with a throwaway key, so a release never finds scripts/sign-update.swift broken.
        run: swift scripts/sign-update.swift self-test Droptimize.zip

      - name: Sign the release
        # The zip the updater downloads, and the feed that points at it, signed with the private key
        # whose public half is built into the app (Update.publicKey in Store/UpdateFeed.swift).
        if: inputs.release_version
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          BUILD: ${{ github.run_number }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::Add the UPDATE_SIGNING_KEY secret first (HANDOFF.md → built-in updater)."
            exit 1
          fi
          built_in=$(sed -n 's/.*static let publicKey = "\(.*\)".*/\1/p' Store/UpdateFeed.swift)
          secret=$(swift scripts/sign-update.swift public-key)
          if [ "$built_in" != "$secret" ]; then
            echo "::error::UPDATE_SIGNING_KEY doesn't match Update.publicKey in Store/UpdateFeed.swift, so the app would refuse this update."
            exit 1
          fi
          app=build/Build/Products/Release/Droptimize.app
          test "$(defaults read "$PWD/$app/Contents/Info" CFBundleShortVersionString)" = "$RELEASE_VERSION"
          test "$(defaults read "$PWD/$app/Contents/Info" CFBundleVersion)" = "$BUILD"
          cp Droptimize.zip "Droptimize-$BUILD.zip"
          printf '%s\n' "$RELEASE_NOTES" > release-notes.txt
          swift scripts/sign-update.swift feed "Droptimize-$BUILD.zip" \
            --version "$RELEASE_VERSION" --build "$BUILD" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/stable/Droptimize-$BUILD.zip" \
            --notes-file release-notes.txt --minimum-system 14.0 > update.json
          cat update.json

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Droptimize-build
          # update.json and the numbered zip only exist for releases.
          path: |
            Droptimize.dmg
            Droptimize.zip
            Droptimize-*.zip
            update.json
          retention-days: 14

  # Replaces the "preview" pre-release with this build. Its links never change:
  # https://github.com/<owner>/<repo>/releases/download/preview/{Droptimize.dmg,Droptimize.zip,install.sh}
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: preview-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v4
        with:
          name: Droptimize-build

      - name: Release notes
        run: |
          cat > notes.md <<EOF
          **Latest build of Droptimize. Replaced automatically on every successful push.**

          Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}, build ${{ github.run_number }}, $(date -u '+%Y-%m-%d %H:%M UTC').
          Early preview. Working: **Convert** (hover it for WebP, AVIF, JPG, PNG or HEIC), **Compress** (JPEG, PNG, WebP, HEIC, AVIF; hover it for target sizes 100 KB–2 MB or a custom size), **Half size** and **Remove BG** (hover it for no background, white, black or any hex color). The center (Auto) does WebP for now. **Video** (MOV, MP4, M4V): **Convert** (WebM, AV1, MP4, HEVC or GIF), **Compress** (10, 25, 50 or 100 MB, or a custom size), **Resize** (1080p, 720p, 480p) and **Mute**; the center makes a WebM. Results are saved next to the original (never changed) and copied to the clipboard.

          ### Install or update (one command)
          Open **Terminal**, paste this and press Return. It downloads the latest build, replaces the old one and opens it:
          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/preview/install.sh | bash
          \`\`\`

          ### Or install by hand
          1. Download **Droptimize.dmg** below and open it.
          2. Drag **Droptimize** into **Applications**.
          3. The app isn't notarized by Apple yet, so macOS blocks it the first time. Open **Terminal** and run:
             \`\`\`
             xattr -cr /Applications/Droptimize.app
             \`\`\`
             Or: open the app, click **Done**, then go to **System Settings → Privacy & Security** and click **Open Anyway**.
          4. Open Droptimize. There's no window or Dock icon: look for the circles icon (three nested circles) in the menu bar and the bubble on the right edge of your screen.
          5. The first time it saves into Desktop, Documents or Downloads, macOS asks for access to that folder. Click **Allow**. Each new preview build may ask again.

          Needs macOS 14 (Sonoma) or newer. Works on Apple Silicon and Intel Macs.
          EOF

      - name: Update the preview release
        # Swap the files in place (install.sh first) rather than deleting the release, so the
        # links are never missing for more than a moment while someone is downloading.
        run: |
          if gh release view preview >/dev/null 2>&1; then
            gh release upload preview scripts/install.sh Droptimize.zip Droptimize.dmg --clobber
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/preview" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit preview --prerelease --title "Droptimize preview" --notes-file notes.md
          else
            gh release create preview scripts/install.sh Droptimize.zip Droptimize.dmg \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Droptimize preview" \
              --notes-file notes.md
          fi
          echo "curl -fsSL https://github.com/$GH_REPO/releases/download/preview/install.sh | bash"

      # The release buyers download and their copies update from:
      # https://github.com/<owner>/<repo>/releases/download/stable/{update.json,Droptimize.dmg,Droptimize-<build>.zip}
      - name: Publish the stable release
        if: inputs.release_version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          BUILD: ${{ github.run_number }}
        run: |
          zip="Droptimize-$BUILD.zip"
          test -f "$zip" && test -f update.json && test -f Droptimize.dmg
          {
            echo "**Droptimize $RELEASE_VERSION** (build $BUILD, $(date -u '+%Y-%m-%d'))."
            echo
            if [ -n "$RELEASE_NOTES" ]; then printf '%s\n\n' "$RELEASE_NOTES"; fi
            cat <<'EOF'
          ### Install
          1. Download **Droptimize.dmg** below and open it.
          2. Drag **Droptimize** into **Applications**, then open it from there.
          3. The first time, macOS says it can't check the app for malicious software (it isn't notarized by Apple yet). Click **Done**, go to **System Settings → Privacy & Security**, scroll down and click **Open Anyway**. Only once.
          4. Look for the circles icon in the menu bar and the bubble on the right edge of your screen.

          After that, Droptimize updates itself: it offers new versions in a small window, or use the menu bar icon → **Check for Updates…**. Needs macOS 14 (Sonoma) or newer, on Apple Silicon or Intel.
          EOF
          } > stable-notes.md
          if gh release view stable >/dev/null 2>&1; then
            # The zip and DMG first and update.json last, so the feed never points at a missing file.
            gh release upload stable "$zip" Droptimize.dmg --clobber
            gh release upload stable update.json --clobber
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/stable" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit stable --prerelease=false --latest --title "Droptimize $RELEASE_VERSION" --notes-file stable-notes.md
          else
            gh release create stable "$zip" Droptimize.dmg update.json \
              --target "$GITHUB_SHA" \
              --latest \
              --title "Droptimize $RELEASE_VERSION" \
              --notes-file stable-notes.md
          fi
          # Keep this zip and the one before it (a copy that read the old feed a moment ago may still
          # be downloading it); delete older ones.
          gh release view stable --json assets --jq '.assets[].name' \
            | grep -E '^Droptimize-[0-9]+\.zip$' | sort -t- -k2 -n | head -n -2 \
            | while read -r old; do gh release delete-asset stable "$old" -y; done
          echo "Released Droptimize $RELEASE_VERSION (build $BUILD): https://github.com/$GH_REPO/releases/tag/stable"
