<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Droptimize launch film</title>
<!--
  The whole film as a pure function of time: window.seek(t) sets every style. No CSS transitions,
  no timers, no state between frames. render.js steps t at 240 fps and blends 4 subframes per
  60 fps frame. window.EVENTS lists the moments mix.py puts sounds on. Spec: ../PROMPT.md and
  ../HANDOFF-VIDEO.md.
-->
<style>
@font-face { font-family: Geist; src: url(fonts/Geist-Variable.woff2) format('woff2'); font-weight: 100 900; }
@font-face { font-family: GeistMono; src: url(fonts/GeistMono-Variable.woff2) format('woff2'); font-weight: 100 900; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0E0E0F; }
#stage { position: absolute; inset: 0; overflow: hidden; font-family: Geist, sans-serif; color: #0E0E0F; }
.abs { position: absolute; left: 0; top: 0; }
/* The film's type scale: seven sizes, each with its own weight, tracking and leading. */
:root { --t-display-xl: 220px; --t-display: 144px; --t-title: 96px; --t-subtitle: 48px;
        --t-body: 28px; --t-ui: 24px; --t-ui-sm: 20px; }
.t-display-xl { font-size: var(--t-display-xl); font-weight: 600; letter-spacing: -0.04em; line-height: 1; }
.t-display    { font-size: var(--t-display); font-weight: 600; letter-spacing: -0.035em; line-height: 1.1; }
.t-title      { font-size: var(--t-title); font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; }
.t-subtitle   { font-size: var(--t-subtitle); font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.t-body       { font-size: var(--t-body); font-weight: 500; letter-spacing: -0.005em; line-height: 1.3; }
.t-ui         { font-size: var(--t-ui); font-weight: 600; line-height: 1.2; }
.t-ui-sm      { font-size: var(--t-ui-sm); font-weight: 500; line-height: 1.2; }
.mono { font-family: GeistMono, monospace; font-weight: 400; letter-spacing: 0; }
.num  { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.word { display: inline-block; white-space: pre; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
'use strict';
// ───────────────────────────── Constants ─────────────────────────────
const W = 1920, H = 1080;
const BEAT = 0.5, BAR = 2;
const END = 31.5;                         // 28.5 s of picture, then a still, silent end card
const C = { canvas: '#EDEBE8', grid: '#E1DED9', ink: '#0E0E0F', mint: '#3DDC97', grey: '#8A8A8E', white: '#FFFFFF' };
const UI = 2.5;                           // the app's points × 2.5 on screen
const BUBBLE = { x: 1835, y: 540, d: 44 * UI };
const RING_R = 80 * UI, SEG_D = 40 * UI, OPT_D = 34 * UI, OPT_R = RING_R + 56 * UI;
const SPRING = [0.35, 0.75], HOVER = [0.2, 0.8], CAM = [0.8, 1.0], SOFT = [0.4, 1.0];

// ───────────────────────────── Maths ─────────────────────────────
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
/** Closed-form step response of a spring (SwiftUI's response/damping model), 0 → 1. */
function step(tau, [resp, damp]) {
  if (tau <= 0) return 0;
  const w0 = TAU / resp;
  if (damp >= 1) return 1 - Math.exp(-w0 * tau) * (1 + w0 * tau);
  const wd = w0 * Math.sqrt(1 - damp * damp);
  return 1 - Math.exp(-damp * w0 * tau) * (Math.cos(wd * tau) + (damp * w0 / wd) * Math.sin(wd * tau));
}
/** A value that changes target many times: one spring per change, summed (a pure function of t). */
function track(t, v0, keys, spec = SPRING) {
  let v = v0, prev = v0;
  for (const [tk, target, s] of keys) { v += (target - prev) * step(t - tk, s || spec); prev = target; }
  return v;
}
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const inOut = x => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const outCubic = x => 1 - Math.pow(1 - clamp(x), 3);
/** 0 → 1 between a and b (spring-like settle, no overshoot). */
const win = (t, a, b) => clamp((t - a) / (b - a));
const on = (t, a, b = Infinity) => t >= a && t < b;
/** Enter at a, exit at b, each a soft spring: returns 0…1. */
const life = (t, a, b = Infinity, spec = SOFT) => step(t - a, spec) - (b < Infinity ? step(t - b, spec) : 0);

// ───────────────────────────── DOM helpers ─────────────────────────────
const stage = document.getElementById('stage');
function el(tag, parent, style = {}, html = '', cls = '') {
  const e = document.createElement(tag);
  e.className = 'abs' + (cls ? ' ' + cls : '');
  Object.assign(e.style, style);
  if (html) e.innerHTML = html;
  (parent || stage).appendChild(e);
  return e;
}
const NS = 'http://www.w3.org/2000/svg';
function svg(parent, w, h, inner, style = {}) {
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('width', w); s.setAttribute('height', h); s.setAttribute('viewBox', `0 0 ${w} ${h}`);
  s.setAttribute('class', 'abs'); Object.assign(s.style, style);
  s.innerHTML = inner; parent.appendChild(s); return s;
}
function put(e, { x = 0, y = 0, s = 1, sx, sy, r = 0, o = 1, blur = 0, ox = 0.5, oy = 0.5 } = {}) {
  e.style.transformOrigin = `${ox * 100}% ${oy * 100}%`;
  e.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg) scale(${sx ?? s}, ${sy ?? s})`;
  e.style.opacity = o <= 0.001 ? 0 : o;
  e.style.filter = blur > 0.05 ? `blur(${blur}px)` : 'none';
  e.style.display = o <= 0.001 ? 'none' : '';
}
const show = (e, v) => { e.style.display = v ? '' : 'none'; };

// ───────────────────────────── Icons (one stroke weight: 1.75 on a 24 grid) ─────────────────────────────
const ICON = {
  logo: c => `<circle cx="12" cy="12" r="9.5" fill="none" stroke="${c}" stroke-width="2"/><circle cx="9.6" cy="14.4" r="5.6" fill="none" stroke="${c}" stroke-width="2"/><circle cx="7.9" cy="16.1" r="2.6" fill="${C.mint}"/>`,
  logoMono: c => `<circle cx="12" cy="12" r="9.5" fill="none" stroke="${c}" stroke-width="2"/><circle cx="9.6" cy="14.4" r="5.6" fill="none" stroke="${c}" stroke-width="2"/><circle cx="7.9" cy="16.1" r="2.6" fill="${c}"/>`,
  convert: c => `<g fill="none" stroke="${c}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10a7 7 0 0 1 12.5-3.5L19 8"/><path d="M19 4v4h-4"/><path d="M19 14a7 7 0 0 1-12.5 3.5L5 16"/><path d="M5 20v-4h4"/></g>`,
  compress: c => `<g fill="none" stroke="${c}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="6" rx="1.5"/><path d="M12 2.5v4M9.5 4.5 12 7l2.5-2.5M12 21.5v-4M9.5 19.5 12 17l2.5 2.5"/></g>`,
  half: c => `<g fill="none" stroke="${c}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4l-6 6M14 5.5V10h4.5M4 20l6-6M10 18.5V14H5.5"/></g>`,
  scissors: c => `<g fill="none" stroke="${c}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="6.5" cy="17.5" r="2.5"/><path d="M8.6 8 20 18M8.6 16 20 6"/></g>`,
  resize: c => `<g fill="none" stroke="${c}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 12V9h3M17 12v3h-3"/></g>`,
  mute: c => `<g fill="none" stroke="${c}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l4.5 5M20.5 9.5 16 14.5"/></g>`,
  check: c => `<path d="M6 12.5l4 4 8-9" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`,
  play: c => `<path d="M9 7.5v9l7.5-4.5z" fill="${c}"/>`,
};
function icon(parent, name, size, color) { return svg(parent, size, size, `<g transform="scale(${size / 24})">${ICON[name](color)}</g>`); }

// Abstract file art (no photos): a few flat shapes per file.
const ART = {
  mountains: (w, h) => `<rect width="${w}" height="${h}" fill="#DCE6F2"/><circle cx="${w * .72}" cy="${h * .32}" r="${h * .12}" fill="#F6D7A7"/><path d="M0 ${h} L${w * .3} ${h * .42} L${w * .55} ${h} Z" fill="#7C8DA8"/><path d="M${w * .3} ${h} L${w * .62} ${h * .3} L${w} ${h * .85} L${w} ${h} Z" fill="#53627C"/><rect y="${h * .78}" width="${w}" height="${h * .22}" fill="#F4F6F9" opacity=".85"/>`,
  forest: (w, h) => `<rect width="${w}" height="${h}" fill="#E4EEDC"/>${[0.12, 0.3, 0.5, 0.68, 0.86].map((k, i) => `<path d="M${w * k} ${h * (.2 + (i % 2) * .08)} L${w * (k + .1)} ${h * .8} L${w * (k - .1)} ${h * .8} Z" fill="${i % 2 ? '#4E7A57' : '#365E41'}"/>`).join('')}<rect y="${h * .8}" width="${w}" height="${h * .2}" fill="#C9D8BD"/>`,
  orbit: (w, h) => `<rect width="${w}" height="${h}" fill="#141A26"/><circle cx="${w * .5}" cy="${h * 1.25}" r="${h * .95}" fill="#3B6EA5"/><circle cx="${w * .5}" cy="${h * 1.25}" r="${h * .95}" fill="none" stroke="#9CC3EA" stroke-width="3" opacity=".7"/>`,
  sky: (w, h) => `<rect width="${w}" height="${h}" fill="#1B1F2E"/>${Array.from({ length: 18 }, (_, i) => `<circle cx="${(i * 53) % w}" cy="${(i * 29) % (h * .6)}" r="${1 + (i % 3) * .6}" fill="#E8ECF6"/>`).join('')}<path d="M0 ${h} L${w * .35} ${h * .6} L${w * .6} ${h} Z" fill="#2E3446"/>`,
  phones: (w, h) => `<rect width="${w}" height="${h}" fill="#F2C94C"/>`,
};
function fileArt(parent, kind, w, h, radius) {
  return svg(parent, w, h, `<defs><clipPath id="c${kind}${w}"><rect width="${w}" height="${h}" rx="${radius}"/></clipPath></defs><g clip-path="url(#c${kind}${w})">${ART[kind](w, h)}</g>`);
}
// Headphones, flat (Remove BG subject)
const HEADPHONES = (s) => `<g transform="scale(${s})" fill="none" stroke="#151515" stroke-width="10" stroke-linecap="round"><path d="M40 120 C40 40 160 40 160 120"/></g><g transform="scale(${s})" fill="#151515"><rect x="22" y="110" width="36" height="62" rx="14"/><rect x="142" y="110" width="36" height="62" rx="14"/></g>`;

// ───────────────────────────── Scene graph ─────────────────────────────
// Screen-space layers: dark cold open; world (camera) for the canvas scenes; overlays.
const bgDark = el('div', stage, { width: W + 'px', height: H + 'px', background: C.ink });
const world = el('div', stage, { width: W + 'px', height: H + 'px', transformOrigin: '0 0' });
const canvasBg = el('div', world, { left: '-1500px', top: '-1000px', width: '4920px', height: '3080px', background: C.canvas });
svg(canvasBg, 4920, 3080, `<defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse" x="12" y="20"><path d="M48 0H0V48" fill="none" stroke="${C.grid}" stroke-width="1"/></pattern></defs><rect width="4920" height="3080" fill="url(#g)"/>`);

// Cold open (screen space)
const cold = el('div', stage, { width: W + 'px', height: H + 'px', background: C.ink });
const COLD = [
  { name: 'IMG_2041.HEIC', size: 12.4, unit: 'MB' },
  { name: 'launch.mov', size: 840, unit: 'MB' },
  { name: 'hero.png', size: 6.1, unit: 'MB' },
  { name: 'shoot.tiff', size: 48, unit: 'MB' },
];
const coldName = el('div', cold, { width: W + 'px', top: '340px', textAlign: 'center', color: '#8A8A8E' }, '', 't-subtitle mono nowrap');
const coldSize = el('div', cold, { width: W + 'px', top: '420px', textAlign: 'center', color: '#FFFFFF' }, '', 't-display-xl num nowrap');
// Four corner ticks that become the mint dots
const TICK_BOX = { x0: 560, y0: 290, x1: 1360, y1: 690 };
const ticks = [0, 1, 2, 3].map(() => el('div', stage, { width: '40px', height: '3px', background: '#FFFFFF', borderRadius: '2px' }));

// Headline layer (world)
const head = el('div', world, { left: '170px', top: '0px', width: '1300px' });
function words(parent, text, style, cls = 't-display') {
  const line = el('div', parent, Object.assign({ position: 'absolute', whiteSpace: 'nowrap' }, style), '', cls);
  line.style.position = 'absolute';
  const spans = text.split(' ').map((w, i, a) => {
    const s = document.createElement('span'); s.className = 'word'; s.textContent = w + (i < a.length - 1 ? ' ' : '');
    line.appendChild(s); return s;
  });
  return { line, spans };
}
const hDrop = words(head, 'Drop it.', { top: '382px' });
const hDone = words(head, 'Done.', { top: '540px' });
const hVideo = words(head, 'Videos too.', { top: '461px' });
const hPrivate = words(head, 'Never leaves your Mac.', { top: '487px', color: '#FFFFFF' }, 't-title');
const hBatch = words(head, 'Ten at once.', { top: '461px' });
// Word list (Convert · Compress · Half size · Remove BG)
const LIST = ['Convert', 'Compress', 'Half size', 'Remove BG'];
const list = LIST.map((w, i) => el('div', head, { top: (300 + i * 110) + 'px', left: '40px' }, w, 't-title nowrap'));
const listDot = el('div', head, { width: '18px', height: '18px', borderRadius: '9px', background: C.mint });
// Mint dots framing the current headline
const dots = [0, 1, 2, 3].map(() => el('div', world, { width: '16px', height: '16px', borderRadius: '8px', background: C.mint }));

// Bubble (world)
const bub = el('div', world, { width: BUBBLE.d + 'px', height: BUBBLE.d + 'px', left: (BUBBLE.x - BUBBLE.d / 2) + 'px', top: (BUBBLE.y - BUBBLE.d / 2) + 'px' });
const bubDisc = el('div', bub, { width: '100%', height: '100%', borderRadius: '50%', background: 'rgba(255,255,255,0.92)', boxShadow: '0 5px 20px rgba(0,0,0,0.22), inset 0 0 0 1.25px rgba(0,0,0,0.10)' });
const bubLogo = icon(bub, 'logo', 55, '#6B6B6F'); put(bubLogo, { x: (BUBBLE.d - 55) / 2, y: (BUBBLE.d - 55) / 2 });
const bubLabel = el('div', bub, { width: BUBBLE.d + 'px', top: (BUBBLE.d / 2 - 15) + 'px', textAlign: 'center', lineHeight: '30px' }, '', 't-ui num nowrap');
const bubCheck = icon(bub, 'check', 56, C.mint);
const ringSvg = svg(world, 160, 160, `<circle cx="80" cy="80" r="67.5" fill="none" stroke="rgba(14,14,15,0.08)" stroke-width="7.5"/><circle id="ringArc" cx="80" cy="80" r="67.5" fill="none" stroke="${C.mint}" stroke-width="7.5" stroke-linecap="round" transform="rotate(-90 80 80)" stroke-dasharray="424.1" stroke-dashoffset="424.1"/>`, { left: (BUBBLE.x - 80) + 'px', top: (BUBBLE.y - 80) + 'px' });
const ringArc = ringSvg.querySelector('#ringArc');
const ripples = [0, 1, 2, 3, 4].map(() => el('div', world, { width: '60px', height: '60px', borderRadius: '50%', border: `3px solid ${C.ink}` }));

// Radial menu (world): segments and option bubbles, rebuilt per scene
const segs = [0, 1, 2, 3].map(() => {
  const d = el('div', world, { width: SEG_D + 'px', height: SEG_D + 'px', borderRadius: '50%', background: 'rgba(255,255,255,0.94)', boxShadow: '0 4px 14px rgba(0,0,0,0.16), inset 0 0 0 1.25px rgba(0,0,0,0.08)' });
  return { d, icons: {} };
});
const SEG_ICONS = ['convert', 'compress', 'half', 'scissors', 'resize', 'mute'];
for (const s of segs) for (const n of SEG_ICONS) {
  s.icons[n] = { dark: icon(s.d, n, 48, C.ink), light: icon(s.d, n, 48, '#FFFFFF') };
  put(s.icons[n].dark, { x: 26, y: 26 }); put(s.icons[n].light, { x: 26, y: 26 });
}
const opts = [0, 1, 2, 3, 4, 5].map(() => el('div', world, { width: OPT_D + 'px', height: OPT_D + 'px', borderRadius: '50%', background: 'rgba(255,255,255,0.96)', boxShadow: '0 3px 12px rgba(0,0,0,0.15), inset 0 0 0 1.25px rgba(0,0,0,0.08)', textAlign: 'center', lineHeight: OPT_D + 'px' }, '', 't-ui nowrap'));

// File tiles (world)
function tile(kind, name, size, w = 230, h = 160) {
  const g = el('div', world, { width: w + 'px', height: (h + 64) + 'px' });
  const card = el('div', g, { width: w + 'px', height: h + 'px', borderRadius: '20px', overflow: 'hidden', boxShadow: '0 10px 30px rgba(0,0,0,0.18)' });
  fileArt(card, kind, w, h, 20);
  el('div', g, { top: (h + 14) + 'px', left: '0px', width: w + 'px', textAlign: 'center', color: '#3A3A3E' }, `${name} <span style="color:#8A8A8E">· ${size}</span>`, 't-ui-sm mono nowrap');
  return { g, card, w, h };
}
const tImg = tile('mountains', 'IMG_2041.HEIC', '12.4\u00A0MB');
const tHero = tile('forest', 'hero.png', '6.1\u00A0MB');
const tVid = tile('orbit', 'launch.mov', '840\u00A0MB');
const vidPlay = icon(tVid.card, 'play', 72, '#FFFFFF'); put(vidPlay, { x: (230 - 72) / 2, y: (160 - 72) / 2, o: 0.95 });
const tPh = tile('phones', 'headphones.jpg', '3.2\u00A0MB');
svg(tPh.card, 230, 160, HEADPHONES(0.62), { left: '53px', top: '22px' });
const batch = Array.from({ length: 10 }, (_, i) => {
  const kinds = ['mountains', 'forest', 'orbit', 'sky', 'phones'];
  const g = el('div', world, { width: '120px', height: '84px', borderRadius: '12px', overflow: 'hidden', boxShadow: '0 6px 18px rgba(0,0,0,0.16)' });
  fileArt(g, kinds[i % 5], 120, 84, 12);
  return g;
});

// Result card (world), left of the bubble
const card = el('div', world, { width: '470px', height: '132px', borderRadius: '26px', background: 'rgba(255,255,255,0.97)', boxShadow: '0 12px 34px rgba(0,0,0,0.16), inset 0 0 0 1.25px rgba(0,0,0,0.06)' });
const cardThumbs = {};
for (const [k, kind] of [['img', 'mountains'], ['hero', 'forest'], ['vid', 'orbit'], ['ph', 'phones'], ['batch', 'sky']]) {
  const t = el('div', card, { left: '16px', top: '16px', width: '100px', height: '100px', borderRadius: '18px', overflow: 'hidden' });
  fileArt(t, kind, 100, 100, 18);
  if (kind === 'phones') svg(t, 100, 100, HEADPHONES(0.42), { left: '8px', top: '12px' });
  cardThumbs[k] = t;
}
const cardBig = el('div', card, { left: '140px', top: '18px' }, '', 't-subtitle num nowrap');
const cardSmall = el('div', card, { left: '142px', top: '84px', color: '#6B6B6F' }, '', 't-ui-sm mono num nowrap');

// Format carousel (Convert)
const FORMATS = ['WebP', 'AVIF', 'JPG', 'PNG', 'HEIC'];
const caro = el('div', world, { left: '210px', top: '800px', width: '1200px', height: '120px' });
const caroWords = FORMATS.map(f => el('div', caro, { top: '0px' }, f, 't-title nowrap'));
const caroPillL = el('div', caro, { height: '118px', top: '-6px', borderRadius: '59px', border: `3px solid ${C.ink}` });
let CARO_W = null;
function caroWidths() {          // measured once from the real glyphs, plus room between words
  if (!CARO_W) CARO_W = caroWords.map(w => { const d = w.style.display; w.style.display = ''; const x = w.offsetWidth; w.style.display = d; return x + 64; });
  return CARO_W;
}

// Remove BG preview (world)
const pv = el('div', world, { left: '920px', top: '260px', width: '620px', height: '460px', borderRadius: '34px', overflow: 'hidden', boxShadow: '0 18px 50px rgba(0,0,0,0.18)' });
const pvChecker = svg(pv, 620, 460, `<defs><pattern id="ck" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#FFFFFF"/><rect width="20" height="20" fill="#E9E9EC"/><rect x="20" y="20" width="20" height="20" fill="#E9E9EC"/></pattern></defs><rect width="620" height="460" fill="url(#ck)"/>`);
const pvYellow = el('div', pv, { width: '620px', height: '460px', background: '#F2C94C' });
const pvFill = el('div', pv, { width: '620px', height: '460px', background: '#FFFFFF' });
const pvShadow = el('div', pv, { left: '190px', top: '370px', width: '240px', height: '26px', borderRadius: '50%', background: 'rgba(0,0,0,0.18)', filter: 'blur(10px)' });
const pvSubject = svg(pv, 620, 460, `<g transform="translate(170 70)">${HEADPHONES(1.4)}</g>`);
const chips = ['None', 'White', 'Black', '#1F2A44'].map(c => el('div', world, { top: '750px', height: '64px', padding: '0 28px', borderRadius: '32px', background: 'rgba(255,255,255,0.97)', boxShadow: '0 4px 14px rgba(0,0,0,0.12), inset 0 0 0 1.25px rgba(0,0,0,0.08)', lineHeight: '64px' }, c, 't-ui nowrap'));

// Private (dark full frame) and the Mac outline
const dark = el('div', world, { background: C.ink, borderRadius: '26px' });
world.insertBefore(dark, head);                 // under the headline, so "Never leaves your Mac." shows on it
const mac = svg(world, 560, 420, `<g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"><rect x="10" y="10" width="540" height="330" rx="22"/><path d="M230 340 L210 400 H350 L330 340"/></g>`, { left: '1330px', top: '330px', transformOrigin: '0 0' });
const macTiles = [0, 1, 2].map((i) => { const g = el('div', world, { width: '90px', height: '64px', borderRadius: '10px', overflow: 'hidden' }); fileArt(g, ['mountains', 'forest', 'orbit'][i], 90, 64, 10); return g; });

  const n = scene.opts.length, base = SEG_ANGLES[scene.optSeg];

    const pressC = step(t - 24.0, [0.12, 1]) - step(t - 24.7, [0.15, 1]);
    const pressV = step(t - 24.5, [0.12, 1]) - step(t - 24.75, [0.15, 1]);
    put(kCmd, { x: 210, y: 820 + 7 * pressC + 20 * (1 - clamp(kp)), o: clamp(kp) });
    put(kV, { x: 350, y: 820 + 7 * pressV + 20 * (1 - clamp(kp)), o: clamp(kp) });
    kCmd.style.boxShadow = `0 ${8 - 7 * pressC}px 0 #000000, 0 16px 26px rgba(0,0,0,0.28)`;
    kV.style.boxShadow = `0 ${8 - 7 * pressV}px 0 #000000, 0 16px 26px rgba(0,0,0,0.28)`;
    const cp = life(t, 23.85, Infinity, [0.45, 0.85]);
    const push = step(t - 25.0, [0.5, 1]);
    put(comp, { y: 24 * (1 - clamp(cp)), s: lerp(0.94, 1, clamp(cp)) * (1 + 0.6 * push), o: clamp(cp) * (1 - push), blur: 18 * push });
    const ip = step(t - 24.5, SPRING);
    put(compImg, { s: lerp(0.6, 1, ip), o: clamp(ip * 3), ox: 0, oy: 0 });
  }

  // ── End (25.5 →)
  {
    const sp = step(t - 25.5, [0.35, 1]) - step(t - 25.9, [0.2, 1]);
    const gone = step(t - 25.9, [0.2, 1]);
    put(endCardSmall, { o: clamp(sp), s: lerp(0.97, 1, clamp(sp)) * (1 + 0.04 * gone), blur: 14 * gone });
    const ep = step(t - 26.05, [0.5, 1]);
    put(endLogo, { x: W / 2 - 75, y: 300, o: ep, s: lerp(0.8, 1, ep) });
    put(endTitle, { o: ep, y: 18 * (1 - ep), blur: 8 * (1 - ep) });
    const tp = step(t - 26.75, [0.5, 1]);
    put(endTag, { o: tp, y: 12 * (1 - tp), blur: 8 * (1 - tp) });
    const pp = step(t - 27.5, [0.5, 1]);
    put(endPrice, { o: pp });
  }

  // ── Cursor
  {
    const c = cursorAt(t);
    const vis = t >= 2.9 && t < 25.0 && !on(t, 19.8, 23.6);
    const pr = c.pressed ? 0.9 : 1;
    put(cursor, { x: c.x - 8, y: c.y - 6, s: pr, o: vis ? 1 : 0, ox: 0.1, oy: 0.05 });
  }
}

// Mint dots: corners of the box around the current headline (world coordinates)
function dotBoxAt(t) {
  const boxes = [
    [2.0, 140, 330, 1060, 720],     // Drop it. / Done.
    [8.0, 160, 270, 840, 760],      // word list
    [16.0, 140, 410, 1100, 640],    // Videos too.
    [20.0, 140, 410, 1520, 640],    // Never leaves your Mac.
    [22.0, 140, 410, 1060, 640],    // Ten at once.
    [24.0, 140, 410, 1060, 640],
    [26.0, 560, 270, 1360, 820],    // end card
  ];
  const k = i => track(t, boxes[0][i], boxes.slice(1).map(b => [b[0], b[i]]), [0.5, 0.88]);
  const x0 = k(1), y0 = k(2), x1 = k(3), y1 = k(4);
  return [[x0, y0], [x1, y0], [x0, y1], [x1, y1]];
}
function showWords(h, t, times, exit) {
  h.spans.forEach((s, i) => {
    const tin = times[Math.min(i, times.length - 1)] + (i >= times.length ? (i - times.length + 1) * 0.125 : 0);
    const p = step(t - tin, [0.4, 1]), q = exit < Infinity ? step(t - exit, [0.35, 1]) : 0;
    const v = clamp(p - q);
    s.style.opacity = v;
    s.style.filter = (p < 0.999 || q > 0.001) ? `blur(${(10 * (1 - p) + 12 * q).toFixed(2)}px)` : 'none';
    s.style.transform = `translateY(${(8 * (1 - p) - 14 * q).toFixed(2)}px)`;
  });
  show(h.line, t >= times[0] - 0.01 && t < exit + 0.6);
}
function hoverAmount(scene, i, t) {
  let v = 0;
  for (let k = 0; k < scene.hovers.length; k++) {
    const [th, si] = scene.hovers[k], next = scene.hovers[k + 1] ? scene.hovers[k + 1][0] : scene.release;
    if (si === i) v += step(t - th, HOVER) - step(t - next, HOVER);
  }
  // The segment whose options are open stays lit while the pointer is out among them
  if (i === scene.optSeg && t >= scene.optsAt && t < scene.release) v = Math.max(v, 0.6);
  return clamp(v);
}
function optHover(scene, j, t) {
  let v = 0;
  for (let k = 0; k < scene.optHover.length; k++) {
    const [th, oj] = scene.optHover[k], next = scene.optHover[k + 1] ? scene.optHover[k + 1][0] : scene.release + 0.2;
    if (oj === j) v += step(t - th, HOVER) - step(t - next, HOVER);
  }
  return clamp(v);
}
function bubbleLabel(t) {
  // Hover labels while a menu is open; check when done; counter during the batch; logo otherwise.
  for (const s of SCENES) {
    if (t >= s.enter && t < s.release) {
      let text = '';
      for (const [th, , label] of s.hovers) if (t >= th) text = label;
      if (t >= s.optsAt && s.optHover.length) {
        for (const [th, j] of s.optHover) if (t >= th) text = s.opts[j];
      }
      if (text) return { text, size: text.length > 7 ? 19 : 24, o: 1, logo: 0, check: 0 };
      return { text: '', size: 24, o: 0, logo: 1, check: 0 };
    }
    if (t >= s.release && t < s.done) return { text: '', size: 24, o: 0, logo: 0, check: 0 };
    if (t >= s.done && t < s.done + 0.9) return { text: '', size: 24, o: 0, logo: 0, check: step(t - s.done, SPRING) };
  }
  if (t >= 22.25 && t < 23.5) {
    const n = clamp(Math.floor((t - 22.25) / 0.125) + 1, 1, 10);
    return { text: `${n}/10`, size: 26, o: 1, logo: 0, check: 0 };
  }
  if (t >= 23.5 && t < 24.4) return { text: '', size: 24, o: 0, logo: 0, check: step(t - 23.5, SPRING) };
  return { text: '', size: 24, o: 0, logo: 1, check: 0 };
}
function progressAt(t) {
  for (const s of SCENES) {
    if (t >= s.release && t < s.done + 0.3) {
      let p;
      if (s.quarters) p = track(t, 0, s.quarters.map((q, i) => [q, (i + 1) / 4]), [0.3, 0.95]);
      else p = clamp(inOut((t - s.work[0]) / (s.work[1] - s.work[0])));
      return { p, o: 1 - smooth((t - s.done) / 0.3) };
    }
  }
  if (t >= 22.25 && t < 23.8) return { p: clamp((t - 22.25) / 1.25), o: 1 - smooth((t - 23.5) / 0.3) };
  return { p: 0, o: 0 };
}
function placeTile(s, t) {
  const T = s.tile, appear = s.grab - 0.75;
  const inP = life(t, appear, Infinity, SPRING);
  if (t < appear - 0.05 || t > s.release + 0.6) { put(T.g, { o: 0 }); return; }
  const c = cursorAt(t);
  let x, y, sc = 1, o = clamp(inP);
  const grabOffset = [c.x - (s.from[0] + 40), c.y - (s.from[1] + 30)];
  if (t < s.grab) { x = s.from[0]; y = s.from[1] + 30 * (1 - clamp(inP)); }
  else if (t < s.release) {
    const g = step(t - s.grab, [0.25, 0.9]);
    x = lerp(s.from[0], c.x - 115, g); y = lerp(s.from[1], c.y - 90, g); sc = 1 - 0.35 * step(t - s.enter, SPRING);
  } else {
    const k = step(t - s.release, [0.3, 1]);
    x = lerp(c.x - 115, BUBBLE.x - T.w / 2, k); y = lerp(c.y - 90, BUBBLE.y - T.h / 2, k); sc = 0.65 * (1 - k) + 0.05 * k; o = 1 - k;
  }
  put(T.g, { x, y, s: sc, o, ox: 0.5, oy: 0.4 });
}
function placeCard(t) {
  const s = SCENES.find(sc => sc.result && t >= sc.result.at - 0.05 && t < sc.cardOut + 0.6);
  const inBatch = t >= 23.5 && t < 25.6;
  if (!s && !inBatch) { put(card, { o: 0 }); return; }
  const at = s ? s.result.at : 23.5, out = s ? s.cardOut : 25.0;
  const p = step(t - at, SPRING) - step(t - out, [0.35, 1]);
  const pos = { x: 1320, y: 474 };
  for (const k in cardThumbs) show(cardThumbs[k], (s && s.result.thumb === k) || (inBatch && k === 'batch'));
  if (s) {
    const r = s.result;
    const ct0 = r.countFrom ?? r.at, ct1 = r.countTo ?? r.at + 0.5;
    const cp = inOut((t - ct0) / (ct1 - ct0));
    const v = Math.exp(lerp(Math.log(r.count[0]), Math.log(r.count[1]), cp));
    const sizeText = v >= 1 ? (v >= 100 ? Math.round(v) + '\u00A0MB' : v.toFixed(1) + '\u00A0MB') : Math.round(v * 1000) + '\u00A0KB';
    const pctShow = t >= (r.countTo ?? r.at + 0.5) - 0.01;
    cardBig.textContent = pctShow ? r.pct : sizeText;
    cardSmall.textContent = pctShow ? `${r.name} · ${sizeText}` : r.name;
  } else {
    cardBig.textContent = '−81%';
    cardSmall.textContent = '10 files';
  }
  put(card, { x: pos.x + 60 * (1 - clamp(p)), y: pos.y, s: lerp(0.9, 1, clamp(p)), o: clamp(p) * (t >= 20.0 && t < 22.0 ? 0 : 1) });
}

window.seek = seek;
window.EVENTS = EVENTS;
window.END = END;
window.ready = document.fonts.ready.then(() => Promise.all([document.fonts.load('600 100px Geist'), document.fonts.load('400 20px GeistMono')]));
seek(0);
</script>
