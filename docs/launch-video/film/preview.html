<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Droptimize film preview</title>
<!--
  Plays film v4 in a browser, with its soundtrack. Serve this folder, then open the page:
      cd docs/launch-video/film && python3 -m http.server 8000
      http://localhost:8000/preview.html          (landscape)   ·   http://localhost:8000/preview.html?reel   (vertical reel)
  The film pages stay pure functions of time (window.seek(t)); this page only drives them. The soundtrack is
  soundtrack-v4.m4a next to this file (git-ignored; build it with mix-v4.py, see ../HANDOFF-V4.md). Without it, the
  film plays silently.
-->
<style>
  :root { --bg: #0E0E0F; --panel: #18181B; --ink: #F4F4F5; --dim: #A1A1AA; --mint: #3DDC97; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 500 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: grid; grid-template-rows: 1fr auto; }
  #stage { position: relative; overflow: hidden; }
  #frame { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #000; }
  #bar { display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: var(--panel); }
  button { font: inherit; color: var(--ink); background: #27272A; border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  button:hover { background: #3F3F46; }
  button.on { background: var(--mint); color: #0E0E0F; }
  #scrub { flex: 1; accent-color: var(--mint); min-width: 80px; }
  #time { font-variant-numeric: tabular-nums; color: var(--dim); white-space: nowrap; }
  #note { color: var(--dim); font-size: 13px; white-space: nowrap; }
  @media (max-width: 640px) { #note { display: none; } #bar { gap: 8px; padding: 10px; } }
</style>
</head>
<body>
<div id="stage"><iframe id="frame" title="Droptimize launch film"></iframe></div>
<div id="bar">
  <button id="play" aria-label="Play">Play</button>
  <input id="scrub" type="range" min="0" max="48" step="0.001" value="0" aria-label="Position">
  <span id="time">0:00.0 / 0:48.0</span>
  <button id="fmt" aria-label="Switch between landscape and reel">Reel</button>
  <span id="note"></span>
</div>
<audio id="audio" src="soundtrack-v4.m4a" preload="auto"></audio>
<script>
'use strict';
const reel = new URLSearchParams(location.search).has('reel');
const size = reel ? { w: 1080, h: 1920 } : { w: 1920, h: 1080 };
const frame = document.getElementById('frame'), stage = document.getElementById('stage');
const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
const fmtBtn = document.getElementById('fmt'), note = document.getElementById('note'), audio = document.getElementById('audio');
frame.width = size.w; frame.height = size.h; frame.src = reel ? 'v4-reel.html' : 'v4.html';
fmtBtn.textContent = reel ? 'Landscape' : 'Reel';
fmtBtn.onclick = () => { location.search = reel ? '' : '?reel'; };

function fit() {
  const r = stage.getBoundingClientRect(), k = Math.min(r.width / size.w, r.height / size.h);
  frame.style.transform = `translate(${(r.width - size.w * k) / 2}px, ${(r.height - size.h * k) / 2}px) scale(${k})`;
}
addEventListener('resize', fit); fit();

let film = null, END = 48, playing = false, t = 0, clock0 = 0, hasAudio = false;
const fmt = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;
function show(s) { t = Math.max(0, Math.min(END, s)); if (film) film.seek(t); scrub.value = t; timeEl.textContent = `${fmt(t)} / ${fmt(END)}`; }
function now() { return hasAudio && !audio.paused ? audio.currentTime : (performance.now() - clock0) / 1000; }
function tick() {
  if (!playing) return;
  const s = now();
  if (s >= END) { pause(); show(END); return; }
  show(s); requestAnimationFrame(tick);
}
function play() {
  if (t >= END - 0.01) show(0);
  playing = true; playBtn.textContent = 'Pause'; playBtn.classList.add('on');
  clock0 = performance.now() - t * 1000;
  if (hasAudio) { audio.currentTime = t; audio.play().catch(() => { hasAudio = false; note.textContent = 'Sound blocked by the browser: click Play again.'; }); }
  requestAnimationFrame(tick);
}
function pause() { playing = false; audio.pause(); playBtn.textContent = 'Play'; playBtn.classList.remove('on'); }
playBtn.onclick = () => (playing ? pause() : play());
scrub.oninput = () => { show(+scrub.value); if (playing) { clock0 = performance.now() - t * 1000; if (hasAudio) audio.currentTime = t; } };
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
  if (e.code === 'ArrowLeft') show(t - 1); if (e.code === 'ArrowRight') show(t + 1);
});
audio.addEventListener('canplaythrough', () => { hasAudio = true; note.textContent = 'With sound · Space plays or pauses'; }, { once: true });
audio.addEventListener('error', () => { hasAudio = false; note.textContent = 'No soundtrack-v4.m4a here: playing silently'; });

frame.addEventListener('load', async () => {
  const w = frame.contentWindow;
  try { await w.ready; } catch (e) { note.textContent = 'The film could not load its photos (run prepare-images-v4.py).'; return; }
  film = w; END = w.END; scrub.max = END; show(0);
});
</script>
</body>
</html>
