<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Droptimize film v4</title>
<!--
  Launch film v4 (Shotbase style). The whole film is a pure function of time: window.seek(t) sets
  every style. No CSS transitions, no timers, no state between frames. Spec: ../PROMPT-v4.md.
  World units: the "desk" layer is a Mac desktop in points (1440 × 900); the camera maps points to
  screen pixels. Everything else (cold open, pills, laptop, keycaps, composer, end card, captions,
  pixel dissolves) is drawn in screen pixels.
-->
<style>
@font-face { font-family: Geist; src: url(fonts/Geist-Variable.woff2) format('woff2'); font-weight: 100 900; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0E0E0F; }
#stage { position: absolute; inset: 0; overflow: hidden; font-family: Geist, sans-serif; color: #0E0E0F; }
.abs { position: absolute; left: 0; top: 0; }
.nowrap { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
img.abs { display: block; object-fit: cover; }
/* Captions: one size, one weight. Words arrive one at a time; one word sits in a mint box. */
.cap { font-size: 64px; font-weight: 600; letter-spacing: -0.012em; word-spacing: 0.1em; line-height: 1.16; color: #FFFFFF; white-space: nowrap; text-shadow: 0 2px 28px rgba(4,16,48,0.38); }
.cap .w[style*="rgba(61"] { text-shadow: none; }
.cap .w { display: inline-block; white-space: pre; line-height: 1.02; border-radius: 11px; padding: 0 8px; margin: 0 -8px; }
/* Screen-space type used outside the captions */
.t-hero  { font-size: 120px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; }
.t-title { font-size: 96px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.1; }
.t-sub   { font-size: 48px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.2; }
.t-lead  { font-size: 40px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
.t-body  { font-size: 28px; font-weight: 500; line-height: 1.3; }
.t-file  { font-size: 26px; font-weight: 450; line-height: 1.2; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
'use strict';
// ───────────────────────────── Time ─────────────────────────────
const W = 1920, H = 1080;
const BEAT = 60 / 128, BAR = 4 * BEAT;              // "Minimal Emotion", 128.00 BPM
const T = (bar, beat = 1, sixteenth = 0) => (bar - 1) * BAR + (beat - 1) * BEAT + sixteenth * BEAT / 4;
const PICTURE = T(31);                               // 56.25 s of picture (two bars for PDFs added 2026-11-05)
const END = PICTURE + 3;                             // then 3 s of still, silent end card
const C = { ink: '#0E0E0F', mint: '#3DDC97', white: '#FFFFFF', grey: '#6B6B6F', grey2: '#8A8A8E', line: 'rgba(0,0,0,0.08)' };

// ───────────────────────────── Maths ─────────────────────────────
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
/** Closed-form step response of a spring (response, damping), 0 → 1. */
function step(tau, [resp, damp]) {
  if (tau <= 0) return 0;
  const w0 = TAU / resp;
  if (damp >= 1) return 1 - Math.exp(-w0 * tau) * (1 + w0 * tau);
  const wd = w0 * Math.sqrt(1 - damp * damp);

}
/** A value that changes target many times: one spring per change, summed. */
function track(t, v0, keys, spec) {

  return v;
}

const outCubic = x => 1 - Math.pow(1 - clamp(x), 3);

}

const desk = el('div', stage, { width: '1440px', height: '900px', transformOrigin: '0 0' });

    if (t >= s.release && t < s.done) return { text: '', o: 0, logo: 0, check: 0 };
    if (t >= s.done && t < s.done + 0.9) return { text: '', o: 0, logo: 0, check: step(t - s.done, SPRING) };
  }
  if (t >= BATCH.enter && t < BATCH.release) return { text: 'Auto', o: 1, logo: 0, check: 0 };
  if (t >= BATCH.release && t < BATCH.done) { const n = clamp(Math.floor((t - BATCH.release) / (BEAT / 4)) + 1, 1, 10); return { text: `${n}/10`, o: 1, logo: 0, check: 0 }; }
  if (t >= BATCH.done && t < BATCH.done + 0.9) return { text: '', o: 0, logo: 0, check: step(t - BATCH.done, SPRING) };
  return { text: '', o: 0, logo: 1, check: 0 };
}
function progressAt(t) {
  for (const s of SCENES) {
    if (t >= s.release && t < s.done + 0.3) {
      const p = s.quarters ? track(t, 0, s.quarters.map((q, i) => [q, (i + 1) / 4]), [0.3, 0.95]) : clamp(inOut((t - s.work[0]) / (s.work[1] - s.work[0])));
      return { p, o: 1 - smooth((t - s.done) / 0.3) };
    }
  }
  if (t >= BATCH.release && t < BATCH.done + 0.3) return { p: clamp((t - BATCH.release) / (BATCH.done - BATCH.release)), o: 1 - smooth((t - BATCH.done) / 0.3) };
  return { p: 0, o: 0 };
}

// ── The old way
function routineScene(t) {
  put(WALL_D, { s: 1.1 + 0.02 * t, x: -t * 6 });
  const A = RT, inR = (a, b) => t >= a && t < b;
  const enter = step(t, [0.5, 1]), loop = step(t - A.n7, [0.45, 1]);
  const push = [A.n2, A.n3, A.n5, A.n6].reduce((v, k) => v + 0.012 * step(t - k, [0.4, 1]), 0);
  put(rWrap, { s: RS * (0.96 + 0.04 * enter + push) * lerp(1, RLOOP.s, loop), y: lerp(0, RLOOP.y, loop) + 24 * (1 - enter), o: enter, blur: 12 * (1 - enter), ox: 0.5, oy: 0.5 });
  const st = t < A.n2 ? 'pics' : t < A.n3 ? 'search' : t < A.n6 ? 'site' : 'down';
  show(fPics.p, st === 'pics'); show(fDown.p, st === 'down'); show(fSearch, st === 'search'); show(fSite, st === 'site');
  rTitle.textContent = st === 'pics' ? 'Pictures' : st === 'down' ? 'Downloads' : '';
  show(rAddr, st === 'search' || st === 'site');
  // Pictures: the photo gets selected
  fPics.rows.forEach((r, i) => { r.row.style.top = 60 + i * 64 + 'px'; r.row.style.background = i === 0 && t >= A.n1 + 0.25 ? 'rgba(59,111,216,0.14)' : 'transparent'; });
  // Search: type the query, then the results drop in
  const k = clamp(Math.floor((t - (A.n2 + 0.05)) / 0.03), 0, QUERY.length);
  sText.textContent = QUERY.slice(0, k) + (st === 'search' && Math.floor(t * 3) % 2 === 0 ? '|' : ' ');
  rAddrText.textContent = st === 'search' ? QUERY.slice(0, k) : 'Image Converter: free online';
  sResults.forEach((g, i) => { const p = step(t - (A.n2 + 0.7 + i * 0.06), [0.3, 1]); put(g, { o: p, y: 10 * (1 - p) }); });
  // The site: upload, wait, download
  const up = clamp((t - A.n3) / (A.n4 - A.n3)) * 0.37 + clamp((t - A.n4) / (A.n5 - A.n4)) * 0.15;
  const got = t >= A.n3 + 0.05;
  put(zHint, { o: got ? 1 - step(t - A.n3, [0.25, 1]) : 1 });
  const chipIn = step(t - A.n3, [0.35, 0.85]);
  put(chip, { o: got ? clamp(chipIn) : 0, s: lerp(0.9, 1, clamp(chipIn)), x: -60 * (1 - clamp(chipIn)) });
  chipFill.style.width = (592 * (t >= A.n5 ? 1 : up)).toFixed(1) + 'px';
  chipStatus.textContent = t < A.n4 ? `Uploading… ${Math.round(up * 100)}%` : t < A.n5 ? 'Converting… please wait' : 'Done';
  put(spinner, { o: inR(A.n3, A.n5) ? 1 : 0, r: (t * 400) % 360 });
  const dl = step(t - A.n5, [0.3, 0.9]), press = step(t - A.n5 - 0.12, [0.08, 1]) - step(t - A.n5 - 0.24, [0.15, 1]);
  put(dlBtn, { o: t >= A.n5 ? clamp(dl) : 0, s: (0.9 + 0.1 * clamp(dl)) * (1 - 0.05 * press) });
  const tr = step(t - A.n5 - 0.22, [0.3, 0.9]);
  put(tray, { o: inR(A.n5 + 0.22, A.n6) ? clamp(tr) : 0, y: -12 * (1 - clamp(tr)) });
  trayFill.style.width = (240 * clamp((t - A.n5 - 0.3) / 0.45)).toFixed(1) + 'px';
  put(ad1, { o: 1 }); put(ad2, { o: 1 });
  // Downloads: unzip, and the file appears
  const unz = t >= A.n6 + 0.3;
  fDown.rows[0].ic.innerHTML = unz ? FOLDER : ZIP;
  fDown.rows[0].row.querySelector('div:nth-child(2)').textContent = unz ? 'converted-files' : 'converted-files.zip';
  const child = step(t - A.n6 - 0.3, [0.3, 0.9]);
  fDown.rows.forEach((r, i) => {
    const y = 60 + i * 64 - (i >= 1 ? 64 * (1 - child) : 0);
    r.row.style.top = (i === 1 ? y : y) + 'px';
    r.row.style.background = (i === 0 && t >= A.n6 && !unz) || (i === 1 && unz) ? 'rgba(59,111,216,0.14)' : 'transparent';
    if (i === 1) { put(r.row, { o: child, x: 40 }); r.row.style.left = '270px'; }
  });
  // Every single time: the steps go round
  stepChips.forEach((c, i) => {
    const p = step(t - (A.n7 + 0.05 + i * 0.05), [0.3, 0.9]);
    const hot = t >= A.n7 + 0.3 && Math.floor((t - A.n7 - 0.3) / 0.13) % STEPS.length === i;
    c.c.style.background = hot ? C.mint : 'rgba(255,255,255,0.14)'; c.tx.style.color = hot ? C.ink : '#FFFFFF';
    put(c.c, { o: p, y: 14 * (1 - p) });
  });
  stepArrows.forEach((a, i) => put(a, { o: step(t - (A.n7 + 0.1 + i * 0.05), [0.3, 1]) }));
  const arc = step(t - (A.n7 + 0.3), [0.6, 1]);
  loopArc.querySelector('path').setAttribute('stroke-dashoffset', (1200 * (1 - arc)).toFixed(0));
  put(loopArc, { o: t >= A.n7 + 0.25 ? 1 : 0 });
}

// ── Photos / Videos pills
function pillScene(t) {
  const inP = life(t, T(18) - 0.1, T(18, 3) - 0.05, [0.35, 1], [0.3, 1]);
  const zoom = step(t - (T(18, 3) - 0.12), [0.3, 1]);
  put(pills, { o: clamp(inP), s: lerp(0.94, 1, clamp(step(t - T(18), [0.4, 1]))) * (1 + 1.4 * zoom), blur: 10 * (1 - clamp(inP)) + 12 * zoom });
  const L = track(t, 18, [[T(18, 2), 658]], [0.28, 0.85]), R = track(t, 622, [[T(18, 2), 1262]], [0.42, 0.9]);
  pillSel.style.width = (R - L) + 'px'; put(pillSel, { x: L });
  const v = step(t - T(18, 2), [0.25, 1]);
  pillWords[0].style.color = mix('#FFFFFF', '#0E0E0F', v); pillWords[1].style.color = mix('#0E0E0F', '#FFFFFF', v);
}

// ── Private: the laptop
function privScene(t) {
  const pull = step(t - T(23), [0.9, 1]);
  const s = lerp(2.6, 1, pull);
  put(lap, { s, ox: 0.6, oy: 0.4, x: lerp(-260, 0, pull) });
  LAPF.forEach((f, i) => {
    const tc = T(23, 3) + i * BEAT;
    const k = step(t - tc, [0.25, 1]);
    put(f.a, { o: 1 - k, y: -8 * k }); put(f.b, { o: k, y: 8 * (1 - k) });
    put(f.g, { x: 0, y: 0, o: 1 });
  });
  // Wi-Fi switches off on "internet"
  const off = step(t - (AT.B + 0.2), [0.35, 1]);
  ['w1', 'w2', 'w3'].forEach((id, i) => wifi.querySelector('#' + id).setAttribute('opacity', (1 - 0.6 * off).toFixed(2)));
  wifi.querySelector('#wx').setAttribute('stroke-dashoffset', (30 * (1 - off)).toFixed(1));
}

// ── Keycaps
function keyScene(t) {
  const inK = life(t, T(27, 3) - 0.1, T(28) - 0.05, [0.3, 1], [0.3, 1]);
  put(keys, { o: clamp(inK), blur: 12 * (1 - clamp(inK)), s: lerp(1.05, 1, clamp(step(t - T(27, 3), [0.6, 1]))) });
  const press = (tk, k) => { const d = step(t - tk, [0.1, 1]) - step(t - tk - 0.32, [0.15, 1]); put(k, { y: 12 * d, o: 1 }); k.style.boxShadow = `0 ${18 - 14 * d}px 0 #050506, 0 ${30 - 10 * d}px 60px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(255,255,255,0.06)`; };
  press(T(27, 3), kCmd); press(T(27, 4), kV);
  kCmd.style.left = '820px'; kV.style.left = '1270px';
}

// ── Composer
function composeScene(t) {
  const inC = life(t, T(28) - 0.1, Infinity, [0.4, 0.9]);
  const zoom = step(t - (T(29) - 0.12), [0.35, 1]);
  put(compose, { o: clamp(inC) * (1 - zoom), y: 30 * (1 - clamp(inC)), s: 1 + 2.2 * zoom, blur: 10 * (1 - clamp(inC)) + 20 * zoom, ox: 0.66, oy: 0.4 });

  put(placeholder, { x: (t >= T(28) && t < T(28, 3)) ? 230 * paste : 0, o: 1 });
  const sendP = step(t - T(28, 3), [0.4, 0.85]);
  put(sent, { o: t >= T(28, 3) ? clamp(sendP * 1.5) : 0, y: 120 * (1 - sendP), s: lerp(0.4, 1, sendP), ox: 0.1, oy: 1 });
  put(sendBtn, { s: 1 - 0.1 * (step(t - T(28, 3), [0.1, 1]) - step(t - T(28, 3) - 0.15, [0.2, 1])) });
}

// ── End card
function endScene(t) {
  const bg = step(t - (T(29) - 0.15), [0.3, 1]);
  put(endL, { o: bg });
  const lp = step(t - T(29), [0.7, 1]);
  put(endLogo, { o: lp, s: lerp(0.86, 1, lp), blur: 16 * (1 - lp) });
  put(endGlow, { o: lp * (0.85 + 0.15 * Math.sin(Math.min(t, PICTURE) * 1.4)), s: lerp(0.7, 1, lp) });
  const tp = step(t - (AT[9] + 0.02), [0.5, 1]);
  put(endTitle, { o: tp, y: 16 * (1 - tp), blur: 10 * (1 - tp) });
  const spans = endTag.querySelectorAll('span');
  [1.16, 1.38, 2.04].forEach((r, i) => { const p = step(t - (AT[9] + r - 0.04), [0.4, 1]); spans[i].style.opacity = p; spans[i].style.filter = p < 0.99 ? `blur(${(10 * (1 - p)).toFixed(1)}px)` : 'none'; spans[i].style.display = 'inline-block'; spans[i].style.transform = `translateY(${(8 * (1 - p)).toFixed(1)}px)`; });
  put(endTag, { o: 1 });
  const pp = step(t - (AT[9] + 2.6), [0.5, 1]);
  put(endPrice, { o: pp, y: 8 * (1 - pp) });
}

// ── Captions
function captionsAt(t) {
  for (const c of CAPS) {
    const first = c.words[0].tw;
    if (t < first - 0.05 || t > c.exit + 0.6) { show(c.box, false); continue; }
    show(c.box, true);
    const q = step(t - c.exit, [0.3, 1]);
    for (const w of c.words) {
      const p = step(t - w.tw, [0.35, 1]), v = clamp(p - q);
      w.s.style.opacity = v;
      w.s.style.filter = (p < 0.995 || q > 0.005) ? `blur(${(10 * (1 - p) + 12 * q).toFixed(2)}px)` : 'none';
      w.s.style.transform = `translateY(${(8 * (1 - p) - 10 * q).toFixed(2)}px)`;
      const h = w.hl ? clamp(step(t - w.hl[0], [0.25, 1]) - (w.hl[1] < Infinity ? step(t - w.hl[1], [0.25, 1]) : 0)) : 0;
      w.s.style.background = h > 0.005 ? `rgba(61,220,151,${h.toFixed(3)})` : 'transparent';
      w.s.style.color = h > 0.005 ? mix(w.color, C.ink, h) : w.color;
    }
  }
}
