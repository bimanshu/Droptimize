<!-- Droptimize's app icon: the Logo mark (Bubble/Logo.swift, same 24-unit numbers) on Apple's
     macOS icon grid (an 824 pt tile on a 1024 pt canvas). Regenerate the PNGs with
     scripts/make-app-icon.js after changing it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3038"/>
      <stop offset="1" stop-color="#0C0E11"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BF0AE"/>
      <stop offset="1" stop-color="#22C47E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3"/>
  <!-- 24-unit grid at 22 px per unit, centered on the tile -->
  <g transform="translate(248 248) scale(22)">
    <circle cx="12" cy="12" r="9.5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="9.6" cy="14.4" r="5.6" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="7.9" cy="16.1" r="2.6" fill="url(#dot)"/>
  </g>
</svg>
